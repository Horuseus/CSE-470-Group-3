<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('My account')}"></head>
<body>
<div th:replace="~{fragments :: header}"></div>

<main class="container narrow">
  <p><a class="link-strong" th:href="@{/dashboard}">← Back to my dashboard</a></p>
  <h1 class="page-title">My account</h1>
  <div th:replace="~{fragments :: flash}"></div>

  <section class="panel">
    <h3>Profile</h3>
    <form method="post" enctype="multipart/form-data" th:action="@{/account/profile}">
      <div class="photo-row">
        <span th:replace="~{fragments :: avatar(${user}, 'xl')}"></span>
        <div>
          <label for="photo">Profile picture</label>
          <input id="photo" type="file" name="photo" accept="image/png,image/jpeg,image/gif">
          <small class="muted">JPG, PNG or GIF. Leave empty to keep your current picture.</small>
        </div>
      </div>

      <div class="row">
        <div><label for="name">Full name</label><input id="name" name="name" th:value="${user.name}" required></div>
        <div><label for="username">Username</label><input id="username" name="username" th:value="${user.username}" required pattern="[a-z0-9_]{3,20}" title="3 to 20 characters: small letters, numbers or underscore"></div>
      </div>
      <div class="row">
        <div><label for="phone">Phone</label><input id="phone" name="phone" th:value="${user.phone}"></div>
        <div><label>Email (used to log in)</label><input th:value="${user.email}" disabled></div>
      </div>

      <!-- Only weavers and cooperative members have a shop location -->
      <div th:if="${weaver != null}">
        <div class="row">
          <div><label for="district">Shop district</label><input id="district" name="district" th:value="${weaver.district}" required></div>
          <div style="flex:2"><label for="shopAddress">Shop address (where your shop or workshop is)</label><input id="shopAddress" name="shopAddress" th:value="${weaver.shopAddress}" placeholder="Village / road / market"></div>
        </div>
        <label for="bio">About me and my weaving</label>
        <textarea id="bio" name="bio" rows="3" th:text="${weaver.bio}"></textarea>
      </div>

      <!-- Only customers have a delivery address -->
      <div th:if="${user.role.name() == 'CUSTOMER'}">
        <label for="deliveryAddress">Delivery address</label>
        <input id="deliveryAddress" name="deliveryAddress" th:value="${user.deliveryAddress}">
      </div>

      <p><button class="btn">Save changes</button></p>
    </form>
  </section>

  <section class="panel">
    <h3>Change password</h3>
    <form method="post" th:action="@{/account/password}">
      <label for="currentPassword">Current password</label>
      <input id="currentPassword" type="password" name="currentPassword" autocomplete="current-password" required>
      <div class="row">
        <div><label for="newPassword">New password (8+ characters)</label><input id="newPassword" type="password" name="newPassword" minlength="8" autocomplete="new-password" required></div>
        <div><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" type="password" name="confirmPassword" minlength="8" autocomplete="new-password" required></div>
      </div>
      <p><button class="btn btn-outline">Change password</button></p>
    </form>
  </section>
</main>

<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
