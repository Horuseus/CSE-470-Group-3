# ============================================================
# Shared settings (safe to share on GitHub: NO passwords here)
# Your private database settings live in application-local.properties
# (that file is git-ignored; copy application-local.properties.example to create it)
# ============================================================
spring.profiles.active=local

# "update" = Hibernate creates/changes tables automatically from our Java classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

# ---- File uploads (design motifs, product photos) ----
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
bunon.upload-dir=uploads

# Address printed inside QR codes. Leave empty to use the address you opened in the browser.
# For phone scanning set it in application-local.properties, e.g. bunon.public-url=http://192.168.0.5:8080
bunon.public-url=
