<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Login')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container py-5" style="max-width: 420px;">
    <h3 class="mb-3">Login</h3>
    <div class="alert alert-danger" th:if="${param.error}">Invalid email or password.</div>
    <div class="alert alert-info" th:if="${param.logout}">You have been logged out.</div>
    <div class="alert alert-success" th:if="${param.registered}">Registered! Weavers can log in now; verification is pending admin review.</div>
    <form th:action="@{/login}" method="post">
        <div class="mb-3"><label class="form-label">Email</label>
            <input class="form-control" type="email" name="username" required></div>
        <div class="mb-3"><label class="form-label">Password</label>
            <input class="form-control" type="password" name="password" required></div>
        <button class="btn btn-dark w-100" type="submit">Login</button>
    </form>
</div>
</body>
</html>
