<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | Bunon'">Bunon</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/bunon.css}">
</head>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Bunon (বুনন)</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav me-auto">
                <!-- WEAVER portal links: add yours here when your feature page exists -->
                <li class="nav-item" sec:authorize="hasRole('WEAVER')"><a class="nav-link" th:href="@{/weaver/dashboard}">Dashboard</a></li>
                <li class="nav-item" sec:authorize="hasRole('WEAVER')"><a class="nav-link" th:href="@{/weaver/looms}">Looms</a></li>
                <li class="nav-item" sec:authorize="hasRole('WEAVER')"><a class="nav-link" th:href="@{/weaver/yield}">Yield</a></li>
                <li class="nav-item" sec:authorize="hasRole('WEAVER')"><a class="nav-link" th:href="@{/weaver/price-calculator}">Pricing</a></li>
                <li class="nav-item" sec:authorize="hasRole('WEAVER')"><a class="nav-link" th:href="@{/weaver/availability}">Availability</a></li>
                <!-- ADMIN portal links -->
                <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a class="nav-link" th:href="@{/admin/dashboard}">Dashboard</a></li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a class="nav-link" th:href="@{/admin/verification}">Verification</a></li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a class="nav-link" th:href="@{/admin/seals}">Craft Seals</a></li>
                <!-- CUSTOMER portal links -->
                <li class="nav-item" sec:authorize="hasRole('CUSTOMER')"><a class="nav-link" th:href="@{/customer/dashboard}">Dashboard</a></li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item" sec:authorize="isAnonymous()"><a class="nav-link" th:href="@{/login}">Login</a></li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button class="btn btn-sm btn-outline-light mt-1" type="submit">
                            Logout (<span sec:authentication="name"></span>)
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>
</body>
</html>
