<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Review Application')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container py-4">
    <h3>Review Application</h3>

    <div class="card p-3 mb-3">
        <p class="mb-1"><b th:text="${application.weaver.user.fullName}"></b></p>
        <p class="mb-1">Email: <span th:text="${application.weaver.user.email}"></span></p>
        <p class="mb-1">Phone: <span th:text="${application.weaver.user.phone}"></span></p>
        <p class="mb-1">Location: <span th:text="${application.weaver.location}"></span></p>
        <p class="mb-1">Specialization: <span th:text="${application.weaver.specialization}"></span></p>
        <p class="mb-1">NID: <span th:text="${application.weaver.nidNumber}"></span></p>
        <p class="mb-0">Status: <span class="badge bg-secondary" th:text="${application.status}"></span></p>
    </div>

    <img th:if="${application.weaver.nidImagePath != null}"
         th:src="@{/admin/verification/{id}/nid(id=${application.id})}"
         class="img-fluid mb-3" style="max-height:300px" alt="NID">

    <div th:if="${application.status.name() == 'PENDING'}">
        <form th:action="@{/admin/verification/{id}/approve(id=${application.id})}" method="post" class="mb-3">
            <button class="btn btn-success">Approve</button>
        </form>

        <form th:action="@{/admin/verification/{id}/request-correction(id=${application.id})}" method="post" class="mb-3">
            <textarea class="form-control mb-2" name="note" placeholder="What needs to be corrected?" required></textarea>
            <button class="btn btn-warning">Request correction</button>
        </form>

        <form th:action="@{/admin/verification/{id}/reject(id=${application.id})}" method="post">
            <textarea class="form-control mb-2" name="note" placeholder="Reason for rejection" required></textarea>
            <button class="btn btn-danger">Reject</button>
        </form>
    </div>

    <p class="text-muted" th:unless="${application.status.name() == 'PENDING'}">
        This application has already been reviewed.
    </p>
    <a class="btn btn-link mt-3" th:href="@{/admin/verification}">Back to queue</a>
</div>
</body>
</html>
