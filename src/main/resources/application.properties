spring.application.name=bunon

# --- Database (MySQL 8). Put your own password in application-local.properties (git-ignored) ---
spring.config.import=optional:classpath:application-local.properties
spring.datasource.url=jdbc:mysql://localhost:3306/bunon?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Dhaka
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false

spring.thymeleaf.cache=false

# --- File uploads (product images, designs, NID documents) ---
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# --- FastAPI similarity service (F2, Sprint 2) ---
app.ai-service.url=http://localhost:8000

# --- Dev admin account created on first start (change before demo!) ---
app.seed-admin.email=admin@bunon.com
app.seed-admin.password=admin123
